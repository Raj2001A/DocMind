services:
  # ── Backend (Docker) ────────────────────────────────────────────────────────
  - type: web
    name: docmind-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: CHROMA_PERSIST_DIR
        value: /data/chroma_db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: CORS_ORIGINS
        value: '["https://docmind-frontend.onrender.com"]'
      - key: CHUNK_SIZE
        value: "512"
      - key: CHUNK_OVERLAP
        value: "50"
      - key: RETRIEVAL_K
        value: "6"
    disk:
      name: docmind-data
      mountPath: /data
      sizeGB: 1

  # ── Frontend (Static) ───────────────────────────────────────────────────────
  - type: web
    name: docmind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /api/*
        destination: https://docmind-1-61cb.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
