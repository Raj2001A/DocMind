services:
  # ── Backend ──────────────────────────────────────────────────────────────────
  - type: web
    name: docmind-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # ── Provider: switch to "openai" or "groq" if needed ───────────────────
      - key: LLM_PROVIDER
        value: groq
      # ── Groq (fast/free Llama) — set API key in Render dashboard ──────────
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # ── Gemini embeddings (always used regardless of LLM provider) ─────────
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: models/text-embedding-004
      # ── OpenAI (optional — only needed if LLM_PROVIDER=openai) ────────────
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      # ── Vector DB & Storage (persistent disk) ─────────────────────────────
      - key: CHROMA_PERSIST_DIR
        value: /data/chroma_db
      - key: UPLOAD_DIR
        value: /data/uploads
      # ── CORS ── update to match your deployed frontend URL ─────────────────
      - key: CORS_ORIGINS
        value: https://docmind-frontend.onrender.com
      # ── Ingestion ──────────────────────────────────────────────────────────
      - key: CHUNK_SIZE
        value: "512"
      - key: CHUNK_OVERLAP
        value: "50"
      - key: RETRIEVAL_K
        value: "6"
    disk:
      name: docmind-data
      mountPath: /data
      sizeGB: 1

  # ── Frontend ─────────────────────────────────────────────────────────────────
  - type: web
    name: docmind-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Points the frontend at the deployed backend — update URL after first deploy
      - key: VITE_API_URL
        value: https://docmind-backend.onrender.com
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /api/*
        destination: https://docmind-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
