version: "3.9"

services:
  backend:
    build: ./backend
    container_name: docmind-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/uploads:/app/uploads
      - ./backend/docmind.db:/app/docmind.db
    env_file:
      - ./backend/.env
    environment:
      # Allow the frontend container to call the backend
      - CORS_ORIGINS=http://localhost:3000,http://docmind-frontend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - docmind-net

  frontend:
    build: ./frontend
    container_name: docmind-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - docmind-net

networks:
  docmind-net:
    driver: bridge

volumes:
  chroma_db:
